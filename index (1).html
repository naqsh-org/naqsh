<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مؤسسة نقش</title>
<meta name="description" content="تواصل مع مؤسسة نقش عبر إنستغرام وفيسبوك وواتساب">
<meta name="theme-color" content="#27767c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* خط الهوية: Neo Sans W23
     يُستخدم من جهاز الزائر إن كان مثبتًا، أو من ملفات الخط إذا رُفعت بجانب الصفحة في مجلد fonts */
  @font-face{
    font-family:'Neo Sans W23';
    src:local('Neo Sans W23'), local('NeoSansW23'), local('NeoSansW23-Regular'),
        url('fonts/NeoSansW23-Regular.woff2') format('woff2'),
        url('fonts/NeoSansW23-Regular.ttf') format('truetype');
    font-weight:400; font-display:swap;
  }
  @font-face{
    font-family:'Neo Sans W23';
    src:local('Neo Sans W23 Bold'), local('NeoSansW23-Bold'),
        url('fonts/NeoSansW23-Bold.woff2') format('woff2'),
        url('fonts/NeoSansW23-Bold.ttf') format('truetype');
    font-weight:700; font-display:swap;
  }

  :root{
    --brand:#27767c;        /* لون الهوية */
    --brand-dark:#1b5a5f;
    --brand-light:#4fa3a8;
    --bg:#eef6f6;           /* خلفية فاتحة من درجة الهوية */
    --card:#ffffff;
    --ink:#27767c;          /* لون الخط */
    --muted:#5f8f92;
    --line:#cfe4e5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f2426; --card:#163235; --ink:#9fd3d6; --muted:#7fb0b3;
      --line:#21474a; --brand-light:#5fb5ba;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f2426; --card:#163235; --ink:#9fd3d6; --muted:#7fb0b3;
    --line:#21474a; --brand-light:#5fb5ba;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Neo Sans W23','Tajawal',system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
    background-image:
      radial-gradient(circle at 12% 8%, color-mix(in srgb,var(--brand-light) 22%,transparent) 0, transparent 42%),
      radial-gradient(circle at 88% 92%, color-mix(in srgb,var(--brand) 18%,transparent) 0, transparent 46%);
  }
  .wrap{width:100%;max-width:420px;text-align:center}
  .mark{width:230px;height:150px;margin:0 auto 18px;display:grid;place-items:center}
  .mark img{width:100%;height:100%;object-fit:contain;display:block}
  .slogan{margin-top:10px;font-size:15px;font-weight:700;letter-spacing:1.5px;color:var(--brand);font-style:italic}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .slogan{color:var(--brand-light)} }
  h1{font-size:28px;font-weight:700;color:var(--ink)}
  .en{font-size:13px;letter-spacing:3px;color:var(--muted);margin-top:4px;text-transform:uppercase}
  .tag{color:var(--muted);margin:14px auto 28px;font-size:15px;line-height:1.7;max-width:300px}
  .links{display:flex;flex-direction:column;gap:14px}
  a.btn{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
    font-size:17px;font-weight:700;transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);border-color:var(--brand-light);
    box-shadow:0 10px 24px -14px color-mix(in srgb,var(--brand) 75%,transparent);outline:none}
  .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;
    color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card))}
  .ico svg{width:22px;height:22px}
  .txt{flex:1;text-align:right}
  .txt small{display:block;text-align:right;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
  .arrow{color:var(--muted);font-size:20px}
  a.btn.primary{background:linear-gradient(145deg,var(--brand-dark),var(--brand));color:#fff;border:none}
  a.btn.primary .txt small,a.btn.primary .arrow{color:rgba(255,255,255,.85)}
  a.btn.primary .ico{background:rgba(255,255,255,.18);color:#fff}
  footer{margin-top:30px;font-size:12px;color:var(--muted)}
</style>
</head>
